bio: |
  Nargess is a physicist by training with expertise in both **experimental** and **computational** biophysics, and in working with _in vitro_ and _ex vivo_ tissues. She brings this dual perspective to fundamental questions of **tissue mechanics** in health and disease.

  She completed her **PhD** under the supervision of [Prof Guillaume Charras](https://charraslab.com/) and [Prof Mark Miodownik](http://www.markmiodownik.net/), then joined the laboratory of [Prof Yanlan Mao](https://www.tissuemechanicslab.com/lab-members) as a postdoctoral researcher. She is now a **Senior Research Fellow** with [Prof Yanlan Mao](https://www.tissuemechanicslab.com/lab-members) and [Dr Gabriel Galea](https://profiles.ucl.ac.uk/55207-gabriel-galea/about).

  Nargess's research focuses on three main themes:
  - **Mechanical response** of **epithelial tissues** to deformation
  - Role of the **basement membrane mechanics** in defining and maintaining **tissue shape**
  - **3D modelling** of **neural tube closure**

  Find out more about her research [here](/research/).

